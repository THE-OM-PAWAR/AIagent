# Virtual host configuration for AIagent

# HTTP Server (Port 80)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME Challenge location for Let's Encrypt / Certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Lightweight healthcheck endpoint
    location /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"nginx"}';
    }

    # Default landing status
    location / {
        default_type text/plain;
        return 200 "AIagent Gateway is active. Telegram Bot operates via secure long polling.\n";
    }

    # In production with real domain and certs, uncomment below to enforce HTTPS:
    # return 301 https://$host$request_uri;
}

# HTTPS Server (Port 443)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Configurable TLS Certificate paths (mount custom certs into /etc/nginx/ssl/)
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;

    # Healthcheck endpoint
    location /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"nginx","tls":true}';
    }

    # Default landing status
    location / {
        default_type text/plain;
        return 200 "AIagent Gateway (HTTPS) is active. Telegram Bot operates via secure long polling.\n";
    }
}

