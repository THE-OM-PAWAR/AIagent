# Production Docker Compose Orchestration for AIagent
name: aiagent

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Python Telegram Assistant Application Service
  app:
    image: ${AIAGENT_IMAGE:-aiagent-app}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiagent-app
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Telegram bot token is required}
      ALLOWED_TELEGRAM_USER_IDS: ${ALLOWED_TELEGRAM_USER_IDS:?Allowed Telegram user IDs are required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Gemini API key is required}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_SYSTEM_INSTRUCTION: ${GEMINI_SYSTEM_INSTRUCTION:-You are a helpful, respectful, and concise personal AI assistant.}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-60.0}
      CONVERSATION_HISTORY_LIMIT: ${CONVERSATION_HISTORY_LIMIT:-20}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # Neon PostgreSQL / SQLAlchemy
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required for Neon PostgreSQL}
      DATABASE_URL_POOLED: ${DATABASE_URL_POOLED:-}
      # Qdrant Vector Storage
      QDRANT_URL: ${QDRANT_URL:-:memory:}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-aiagent_memories}
      # Embedding & Memory Pipeline
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-3072}
      MEMORY_TOP_K: ${MEMORY_TOP_K:-5}
      MEMORY_SIMILARITY_THRESHOLD: ${MEMORY_SIMILARITY_THRESHOLD:-0.65}
      # Model Tier Routing
      MODEL_TIER_SMALL: ${MODEL_TIER_SMALL:-gemini-3.5-flash}
      MODEL_TIER_MEDIUM: ${MODEL_TIER_MEDIUM:-gemini-3.6-flash}
      MODEL_TIER_LARGE: ${MODEL_TIER_LARGE:-gemini-3.6-flash}
    networks:
      - aiagent-network
    healthcheck:
      test: ["CMD", "python", "-m", "src.healthcheck", "--skip-telegram"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *default-logging

networks:
  aiagent-network:
    name: aiagent-network
    driver: bridge

